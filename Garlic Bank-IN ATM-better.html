<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大蒜银行 - 网络同步版</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00c6ff;
            --secondary: #0072ff;
            --accent: #6a11cb;
            --dark-bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.8);
            --card-border: rgba(56, 189, 248, 0.2);
            --text: #e2e8f0;
            --text-light: #94a3b8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --glow: 0 0 10px rgba(0, 198, 255, 0.5);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Exo 2', sans-serif; }
        body {
            background: linear-gradient(135deg, var(--dark-bg) 0%, #1e293b 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
            overflow-x: hidden;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(106,17,203,0.1) 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(0,114,255,0.1) 0%, transparent 40%);
            z-index: -1;
        }
        .container { max-width: 1300px; margin: 0 auto; }
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 0; margin-bottom: 30px; flex-wrap: wrap; gap: 15px;
        }
        .logo-container {
            display: flex; align-items: center; gap: 20px; position: relative;
        }
        .logo-preview {
            width: 70px; height: 70px; border-radius: 18px;
            background: rgba(30,41,59,0.6); display: flex; align-items: center; justify-content: center;
            overflow: hidden; border: 1px solid var(--card-border); cursor: pointer;
            transition: all 0.3s ease; backdrop-filter: blur(10px); box-shadow: var(--glow);
        }
        .logo-preview:hover { transform: translateY(-5px); box-shadow: 0 0 20px rgba(0,198,255,0.7); }
        .logo-preview img { max-width: 100%; max-height: 100%; border-radius: 18px; }
        .logo-preview i { font-size: 1.8rem; color: var(--primary); }
        .bank-title {
            font-size: 2.2rem; font-weight: 700;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-family: 'Orbitron', sans-serif; letter-spacing: 1px;
        }
        .bank-title span { color: white; text-shadow: 0 0 10px rgba(0,198,255,0.7); }
        .header-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .stats-container {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
            gap: 20px; margin-bottom: 30px;
        }
        .stat-card {
            background: var(--card-bg); border-radius: 16px; padding: 20px;
            display: flex; flex-direction: column; align-items: flex-start;
            transition: all 0.3s ease; border: 1px solid var(--card-border);
            backdrop-filter: blur(10px); box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative; overflow: hidden;
        }
        .stat-card::before {
            content: ""; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, var(--primary), var(--accent), var(--secondary));
            z-index: -1; border-radius: 18px;
        }
        .stat-card::after {
            content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: var(--card-bg); border-radius: 16px; z-index: -1;
        }
        .stat-card:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(0,0,0,0.3); }
        .stat-icon {
            width: 50px; height: 50px; border-radius: 14px;
            background: rgba(0,198,255,0.1); display: flex; align-items: center; justify-content: center;
            margin-bottom: 15px;
        }
        .stat-icon i { font-size: 1.5rem; color: var(--primary); }
        .stat-value {
            font-size: 1.6rem; font-weight: 700; color: var(--text);
            margin: 5px 0; font-family: 'Orbitron', sans-serif; letter-spacing: 1px;
        }
        .stat-label { font-size: 0.9rem; color: var(--text-light); font-weight: 500; }
        .main-content {
            display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 30px;
        }
        @media (max-width: 900px) { .main-content { grid-template-columns: 1fr; } }
        .panel {
            background: var(--card-bg); border-radius: 16px; padding: 25px;
            transition: all 0.3s ease; border: 1px solid var(--card-border);
            backdrop-filter: blur(10px); box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative; overflow: hidden;
        }
        .panel::before {
            content: ""; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, var(--primary), var(--accent), var(--secondary));
            z-index: -1; border-radius: 18px;
        }
        .panel::after {
            content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: var(--card-bg); border-radius: 16px; z-index: -1;
        }
        .panel:hover { box-shadow: 0 15px 35px rgba(0,0,0,0.3); }
        .panel-title {
            font-size: 1.2rem; font-weight: 700; color: var(--text);
            margin-bottom: 20px; padding-bottom: 12px;
            border-bottom: 1px solid var(--card-border);
            display: flex; align-items: center; gap: 12px;
            font-family: 'Orbitron', sans-serif; letter-spacing: 1px;
        }
        .panel-title i {
            color: var(--primary); background: rgba(0,198,255,0.1);
            width: 34px; height: 34px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
        }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block; margin-bottom: 8px; font-weight: 500;
            color: var(--text); font-size: 0.9rem;
        }
        .form-control {
            width: 100%; padding: 12px 16px; border: 1px solid var(--card-border);
            border-radius: 12px; font-size: 1rem; transition: all 0.3s ease;
            background: rgba(15,23,42,0.5); color: var(--text); outline: none;
        }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0,198,255,0.2); }
        .btn {
            padding: 12px 22px; border: none; border-radius: 12px; font-size: 0.95rem;
            font-weight: 600; cursor: pointer; transition: all 0.3s ease;
            display: inline-flex; align-items: center; justify-content: center;
            gap: 8px; background: rgba(0,198,255,0.1); color: var(--text);
            border: 1px solid var(--card-border); position: relative; overflow: hidden;
        }
        .btn::before {
            content: ""; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0,198,255,0.2), transparent);
            transition: 0.5s;
        }
        .btn:hover::before { left: 100%; }
        .btn:hover { background: rgba(0,198,255,0.2); transform: translateY(-3px); }
        .btn-primary { background: linear-gradient(45deg, var(--primary), var(--secondary)); color: white; border: none; }
        .btn-success { background: linear-gradient(45deg, var(--success), #059669); color: white; border: none; }
        .btn-warning { background: linear-gradient(45deg, var(--warning), #d97706); color: white; border: none; }
        .btn-danger { background: linear-gradient(45deg, var(--danger), #b91c1c); color: white; border: none; }
        .btn-info { background: linear-gradient(45deg, #3b82f6, #1d4ed8); color: white; border: none; }
        .btn-block { display: block; width: 100%; }
        .btn-sm { padding: 6px 12px; font-size: 0.8rem; }
        .account-list { max-height: 420px; overflow-y: auto; padding-right: 10px; }
        .account-list::-webkit-scrollbar { width: 8px; }
        .account-list::-webkit-scrollbar-track { background: rgba(15,23,42,0.5); border-radius: 10px; }
        .account-list::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
        .account-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px; border-radius: 14px; background: rgba(15,23,42,0.5);
            margin-bottom: 12px; transition: all 0.3s ease;
            border: 1px solid var(--card-border); flex-wrap: wrap; gap: 10px;
        }
        .account-item:hover { background: rgba(30,41,59,0.7); transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .account-info h3 { font-size: 1.1rem; margin-bottom: 4px; color: var(--text); }
        .account-info p { color: var(--text-light); font-size: 0.85rem; }
        .account-balance {
            font-size: 1.2rem; font-weight: 700; color: var(--text);
            min-width: 100px; text-align: right; font-family: 'Orbitron', sans-serif;
        }
        .account-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .transaction-history { margin-top: 20px; }
        .transaction-item {
            display: flex; justify-content: space-between; padding: 14px;
            border-radius: 14px; background: rgba(15,23,42,0.5);
            margin-bottom: 10px; border: 1px solid var(--card-border);
            transition: all 0.2s ease; flex-wrap: wrap; gap: 8px;
        }
        .transaction-item:hover { background: rgba(30,41,59,0.7); transform: translateY(-3px); }
        .transaction-item.deposit { border-left: 4px solid var(--success); }
        .transaction-item.withdrawal { border-left: 4px solid var(--warning); }
        .transaction-details { flex: 1; }
        .transaction-details .type {
            font-weight: 600; font-size: 0.95rem; margin-bottom: 4px;
            display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
        }
        .transaction-details .type .category {
            font-size: 0.8rem; background: rgba(56,189,248,0.1);
            padding: 2px 10px; border-radius: 20px; color: var(--text-light); font-weight: 500;
        }
        .transaction-amount {
            font-weight: 700; font-size: 1rem; min-width: 100px;
            text-align: right; font-family: 'Orbitron', sans-serif;
        }
        .deposit-amount { color: var(--success); }
        .withdrawal-amount { color: var(--warning); }
        .transaction-date { color: var(--text-light); font-size: 0.8rem; margin-top: 4px; }
        .balance-change {
            display: flex; margin-top: 6px; font-size: 0.8rem;
            color: var(--text-light); gap: 8px;
        }
        .balance-change span { background: rgba(15,23,42,0.7); padding: 2px 8px; border-radius: 6px; }
        .logo-upload { display: none; }
        .empty-state {
            text-align: center; padding: 30px 20px; color: var(--text-light);
        }
        .empty-state i { font-size: 3rem; color: rgba(148,163,184,0.3); margin-bottom: 12px; }
        .empty-state h3 { font-weight: 500; margin-bottom: 8px; color: var(--text); }
        .notification {
            position: fixed; top: 25px; right: 25px; padding: 16px 24px;
            border-radius: 14px; background: var(--card-bg); color: var(--text);
            font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transform: translateX(200%); transition: transform 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
            z-index: 1000; display: flex; align-items: center; gap: 12px;
            border: 1px solid var(--card-border); backdrop-filter: blur(10px);
            max-width: 90vw;
        }
        .notification.show { transform: translateX(0); }
        .notification.error { border-left: 4px solid var(--danger); }
        .notification.success { border-left: 4px solid var(--success); }
        .notification i { font-size: 1.3rem; }
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 2000; align-items: center; justify-content: center;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background: var(--card-bg); border-radius: 20px; padding: 30px;
            width: 90%; max-width: 500px; box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            position: relative; animation: modalOpen 0.5s cubic-bezier(0.175,0.885,0.32,1.275);
            border: 1px solid var(--card-border); backdrop-filter: blur(10px);
            max-height: 90vh; overflow-y: auto;
        }
        @keyframes modalOpen {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .close-modal {
            position: absolute; top: 15px; right: 20px; font-size: 1.8rem;
            cursor: pointer; color: var(--text-light); background: none; border: none;
            transition: all 0.3s ease;
        }
        .close-modal:hover { color: var(--danger); transform: rotate(90deg); }
        .modal-title {
            font-size: 1.4rem; margin-bottom: 20px; color: var(--text);
            display: flex; align-items: center; gap: 12px;
            font-family: 'Orbitron', sans-serif;
        }
        .account-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding-bottom: 15px;
            border-bottom: 1px solid var(--card-border); flex-wrap: wrap; gap: 10px;
        }
        .balance-display {
            font-size: 1.6rem; font-weight: 700; color: var(--text);
            text-align: center; margin: 20px 0; padding: 16px;
            background: rgba(15,23,42,0.5); border-radius: 16px;
            border: 1px solid var(--card-border); font-family: 'Orbitron', sans-serif;
        }
        .operation-type {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px;
        }
        .op-type-btn {
            padding: 14px; border-radius: 14px; border: 1px solid var(--card-border);
            background: rgba(15,23,42,0.5); display: flex; flex-direction: column;
            align-items: center; justify-content: center; cursor: pointer;
            transition: all 0.3s ease;
        }
        .op-type-btn.active {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white; border-color: transparent; box-shadow: 0 5px 15px rgba(0,114,255,0.3);
        }
        .op-type-btn i { font-size: 1.5rem; margin-bottom: 8px; color: var(--primary); }
        .op-type-btn.active i { color: white; }
        .op-type-btn span { font-weight: 600; font-size: 0.95rem; }
        .category-select { margin-bottom: 18px; }
        .operation-buttons {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px;
        }
        footer {
            text-align: center; padding: 20px; color: var(--text-light);
            margin-top: 30px; font-size: 0.9rem; border-top: 1px solid var(--card-border);
        }
        .holographic-line {
            height: 2px; background: linear-gradient(90deg, transparent, var(--primary), transparent);
            margin: 15px 0; border-radius: 2px;
        }
        .atm-container { display: none; margin-top: 20px; }
        .atm-machine {
            background: linear-gradient(145deg, #1a253a, #0d1525);
            border-radius: 20px; padding: 25px; border: 1px solid var(--card-border);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5); position: relative; overflow: hidden;
            max-width: 800px; margin: 0 auto;
        }
        .atm-screen {
            background: linear-gradient(135deg, #0a0f1a, #1e293b);
            border-radius: 15px; padding: 20px; margin-bottom: 20px;
            border: 2px solid var(--card-border); min-height: 280px;
            display: flex; flex-direction: column;
        }
        .atm-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding-bottom: 12px;
            border-bottom: 1px solid var(--card-border); flex-wrap: wrap; gap: 8px;
        }
        .atm-title {
            font-size: 1.6rem; font-weight: 700;
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-family: 'Orbitron', sans-serif; letter-spacing: 1px;
        }
        .atm-account-info { margin-bottom: 15px; }
        .atm-account-select { width: 100%; margin-bottom: 15px; background: rgba(15,23,42,0.7); }
        .atm-actions {
            display: grid; grid-template-columns: repeat(2,1fr); gap: 12px; margin-top: 15px;
        }
        .atm-action-btn {
            padding: 16px; font-size: 1rem; border-radius: 15px;
            background: rgba(15,23,42,0.7); border: 1px solid var(--card-border);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.3s ease;
        }
        .atm-action-btn:hover { background: rgba(0,198,255,0.2); transform: translateY(-3px); }
        .atm-action-btn i { font-size: 1.8rem; margin-bottom: 8px; color: var(--primary); }
        .atm-form { display: none; margin-top: 15px; }
        .atm-buttons { display: grid; grid-template-columns: repeat(2,1fr); gap: 12px; margin-top: 15px; }
        .atm-numpad {
            display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-top: 15px;
        }
        .atm-num-btn {
            padding: 12px; font-size: 1.1rem; border-radius: 12px;
            background: rgba(15,23,42,0.7); border: 1px solid var(--card-border);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.3s ease;
        }
        .atm-num-btn:hover { background: rgba(0,198,255,0.2); }
        .atm-action-buttons { display: flex; gap: 12px; margin-top: 15px; flex-wrap: wrap; }
        .back-to-bank { margin-top: 15px; width: 100%; }
        @media (max-width: 768px) {
            .container { padding: 10px; }
            .bank-title { font-size: 1.6rem; }
            .panel { padding: 16px; }
            .account-item { flex-direction: column; align-items: flex-start; gap: 10px; }
            .account-balance, .account-actions { width: 100%; text-align: left; }
            .account-actions { justify-content: flex-start; }
            .atm-actions { grid-template-columns: 1fr; }
            .header-actions { width: 100%; justify-content: flex-start; }
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .pulse { animation: pulse 1s ease-in-out; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div class="logo-container">
            <div class="logo-preview" id="logoPreview">
                <i class="fas fa-university"></i>
                <img id="logoImage" src="" alt="Bank Logo">
            </div>
            <h1 class="bank-title">大蒜<span>银行</span></h1>
        </div>
        <div class="header-actions">
            <button id="syncBtn" class="btn btn-info"><i class="fas fa-sync"></i> 同步</button>
            <button id="atmBtn" class="btn btn-primary"><i class="fas fa-cash-register"></i> ATM</button>
        </div>
        <input type="file" id="logoUpload" class="logo-upload" accept="image/*">
    </header>
    <div class="holographic-line"></div>

    <div class="bank-content">
        <div class="stats-container">
            <div class="stat-card"><div class="stat-icon"><i class="fas fa-users"></i></div><div class="stat-value" id="totalAccounts">0</div><div class="stat-label">总账户数</div></div>
            <div class="stat-card"><div class="stat-icon"><i class="fas fa-coins"></i></div><div class="stat-value" id="totalBalance">0</div><div class="stat-label">总资产 (蒜币)</div></div>
            <div class="stat-card"><div class="stat-icon"><i class="fas fa-exchange-alt"></i></div><div class="stat-value" id="totalTransactions">0</div><div class="stat-label">总交易数</div></div>
            <div class="stat-card"><div class="stat-icon"><i class="fas fa-piggy-bank"></i></div><div class="stat-value" id="avgBalance">0</div><div class="stat-label">平均余额 (蒜币)</div></div>
        </div>

        <div class="main-content">
            <div class="panel">
                <h2 class="panel-title"><i class="fas fa-user-plus"></i>添加新账户</h2>
                <form id="addAccountForm">
                    <div class="form-group"><label for="accountName"><i class="fas fa-user"></i> 持卡人姓名</label><input type="text" id="accountName" class="form-control" placeholder="请输入姓名" required></div>
                    <div class="form-group"><label for="accountNumber"><i class="fas fa-credit-card"></i> 银行卡号</label><input type="text" id="accountNumber" class="form-control" placeholder="请输入16位卡号" required maxlength="16"></div>
                    <div class="form-group"><label for="initialBalance"><i class="fas fa-money-bill-wave"></i> 初始余额 (蒜币)</label><input type="number" id="initialBalance" class="form-control" value="1000" min="0" required></div>
                    <button type="submit" class="btn btn-primary btn-block"><i class="fas fa-plus-circle"></i> 创建账户</button>
                </form>
            </div>
            <div class="panel">
                <h2 class="panel-title"><i class="fas fa-credit-card"></i>账户管理</h2>
                <div class="account-list" id="accountList">
                    <div class="empty-state" id="emptyAccounts"><i class="fas fa-wallet"></i><h3>暂无账户信息</h3><p>请添加新账户以开始使用大蒜银行</p></div>
                </div>
            </div>
        </div>

        <div class="panel">
            <h2 class="panel-title"><i class="fas fa-history"></i>交易记录</h2>
            <div class="transaction-history" id="transactionHistory">
                <div class="empty-state" id="emptyTransactions"><i class="fas fa-receipt"></i><h3>暂无交易记录</h3><p>账户资金操作将显示在这里</p></div>
            </div>
        </div>
    </div>

    <!-- ATM -->
    <div class="atm-container" id="atmContainer">
        <div class="atm-machine">
            <div class="atm-screen">
                <div class="atm-header">
                    <div class="atm-title">大蒜银行 ATM</div>
                    <div class="account-balance" id="atmAccountBalance">0.00 蒜币</div>
                </div>
                <div class="atm-account-info">
                    <div class="form-group"><label for="atmAccountSelect"><i class="fas fa-credit-card"></i> 选择账户</label>
                        <select id="atmAccountSelect" class="form-control atm-account-select"><option value="">请选择您的账户</option></select>
                    </div>
                </div>
                <div id="atmMainMenu">
                    <h3><i class="fas fa-list"></i> 请选择操作类型</h3>
                    <div class="atm-actions">
                        <div class="atm-action-btn" id="atmBalanceBtn"><i class="fas fa-wallet"></i><span>查询余额</span></div>

// 云端读写（JSONBin）
// ============================================================
async function loadDataFromCloud() {
    try {
        const headers = { 'Content-Type': 'application/json' };
        if (JSONBIN_CONFIG.apiKey) {
            headers['X-Access-Key'] = JSONBIN_CONFIG.apiKey;
        }
        const response = await fetch(JSONBIN_URL, { headers });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const result = await response.json();
        bankData = result.record || { accounts: [], transactions: [], logo: null };
        localStorage.setItem('garlicBankCache', JSON.stringify(bankData));
        return true;
    } catch (e) {
        console.error('从云端加载失败', e);
        const cache = localStorage.getItem('garlicBankCache');
        if (cache) {
            bankData = JSON.parse(cache);
            showNotification('从本地缓存加载（云端同步失败）', 'error');
            return true;
        }
        showNotification('无法连接云端，请检查网络', 'error');
        return false;
    }
}

async function saveDataToCloud() {
    try {
        const headers = {
            'Content-Type': 'application/json',
            'X-Bin-Version': 'latest'
        };
        if (JSONBIN_CONFIG.apiKey) {
            headers['X-Access-Key'] = JSONBIN_CONFIG.apiKey;
        }
        const response = await fetch(JSONBIN_UPDATE_URL, {
            method: 'PUT',
            headers: headers,
            body: JSON.stringify(bankData)
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        localStorage.setItem('garlicBankCache', JSON.stringify(bankData));
        return true;
    } catch (e) {
        console.error('保存到云端失败', e);
        localStorage.setItem('garlicBankCache', JSON.stringify(bankData));
        showNotification('同步失败，数据已保存在本地', 'error');
        return false;
    }
}

// ============================================================
// 辅助函数
// ============================================================
function formatDate(dateString) {
    const date = new Date(dateString);
    return date.toLocaleString('zh-CN', {
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit'
    });
}

function showNotification(message, type = '') {
    const icon = type === 'error' ? 'exclamation-circle' : 'check-circle';
    notification.innerHTML = `<i class="fas fa-${icon}"></i><span>${message}</span>`;
    notification.className = `notification ${type}`;
    notification.classList.add('show');
    setTimeout(() => notification.classList.remove('show'), 3000);
}

function addTransaction(accountId, type, amount, category, note, prevBalance, newBalance) {
    const account = bankData.accounts.find(acc => acc.id === accountId);
    if (!account) return;
    let categoryName = '';
    if (type === 'income' || type === 'adjustment') {
        const cat = operationCategories.income?.find(c => c.id === category) ||
                    {name: category === 'adjustment' ? '余额调整' : '其他收入'};
        categoryName = cat.name;
    } else {
        const cat = operationCategories.expense?.find(c => c.id === category) ||
                    {name: '其他支出'};
        categoryName = cat.name;
    }
    bankData.transactions.unshift({
        id: Date.now().toString(),
        accountId,
        accountName: account.name,
        accountNumber: account.number,
        type,
        amount,
        category: categoryName,
        note,
        previousBalance: prevBalance || account.balance,
        newBalance: newBalance || (type === 'income' ? account.balance + amount : account.balance - amount),
        date: new Date().toISOString()
    });
}

// ============================================================
// 渲染函数
// ============================================================
function renderAccounts() {
    if (bankData.accounts.length === 0) {
        emptyAccounts.style.display = 'block';
        accountList.innerHTML = '';
        return;
    }
    emptyAccounts.style.display = 'none';
    accountList.innerHTML = '';
    bankData.accounts.forEach(account => {
        const item = document.createElement('div');
        item.className = 'account-item';
        item.innerHTML = `
            <div class="account-info">
                <h3>${account.name}</h3>
                <p>卡号: ${account.number} | 创建于: ${formatDate(account.createdAt)}</p>
            </div>
            <div class="account-balance">${account.balance.toFixed(2)} 蒜币</div>
            <div class="account-actions">
                <button class="btn btn-success btn-sm" onclick="openOperationModal('${account.id}', 'income')"><i class="fas fa-plus"></i> 收入</button>
                <button class="btn btn-warning btn-sm" onclick="openOperationModal('${account.id}', 'expense')"><i class="fas fa-minus"></i> 支出</button>
                <button class="btn btn-primary btn-sm" onclick="openOperationModal('${account.id}', 'adjust')"><i class="fas fa-edit"></i> 调整</button>
            </div>
        `;
        accountList.appendChild(item);
    });
}

function renderTransactions() {
    if (bankData.transactions.length === 0) {
        emptyTransactions.style.display = 'block';
        transactionHistory.innerHTML = '';
        return;
    }
    emptyTransactions.style.display = 'none';
    transactionHistory.innerHTML = '';
    const recent = bankData.transactions.slice(0, 15);
    recent.forEach(trans => {
        const div = document.createElement('div');
        div.className = `transaction-item ${trans.type === 'income' || trans.type === 'adjustment' ? 'deposit' : 'withdrawal'}`;
        let typeText = trans.type === 'income' ? '收入' : trans.type === 'withdrawal' ? '支出' : '调整';
        let amountClass = trans.type === 'income' || trans.type === 'adjustment' ? 'deposit-amount' : 'withdrawal-amount';
        div.innerHTML = `
            <div class="transaction-details">
                <div class="type">${trans.accountName} - ${typeText} <span class="category">${trans.category}</span></div>
                <div>${trans.note}</div>
                <div class="transaction-date">${formatDate(trans.date)}</div>
                <div class="balance-change"><span>前: ${trans.previousBalance.toFixed(2)}</span><span>新: ${trans.newBalance.toFixed(2)}</span></div>
            </div>
            <div class="transaction-amount ${amountClass}">${trans.type === 'withdrawal' ? '-' : '+'}${trans.amount.toFixed(2)} 蒜币</div>
        `;
        transactionHistory.appendChild(div);
    });
}

function updateStats() {
    totalAccounts.textContent = bankData.accounts.length;
    const total = bankData.accounts.reduce((sum, acc) => sum + acc.balance, 0);
    totalBalance.textContent = total.toFixed(2);
    totalTransactions.textContent = bankData.transactions.length;
    const avg = bankData.accounts.length ? (total / bankData.accounts.length).toFixed(2) : '0.00';
    avgBalance.textContent = avg;
}

function renderAtmAccounts() {
    atmAccountSelect.innerHTML = '<option value="">请选择您的账户</option>';
    atmTransferAccount.innerHTML = '<option value="">请选择收款账户</option>';

        const opt1 = document.createElement('option');

        opt1.textContent = `${account.name} (${account.number}) - ${account.balance.toFixed(2)} 蒜币`;
        atmAccountSelect.appendChild(opt1);
        const opt2 = document.createElement('option');
        opt2.value = account.id;
        opt2.textContent = `${account.name} (${account.number})`;
        atmTransferAccount.appendChild(opt2);
    });
}

// ============================================================
// 操作函数
// ============================================================
async function handleAddAccount(e) {
    e.preventDefault();
    const name = document.getElementById('accountName').value.trim();
    const number = document.getElementById('accountNumber').value.trim();
    const balance = parseFloat(document.getElementById('initialBalance').value);
    if (!name) { showNotification('请输入姓名', 'error'); return; }
    if (number.length !== 16 || !/^\d+$/.test(number)) { showNotification('卡号必须16位数字', 'error'); return; }
    if (bankData.accounts.some(acc => acc.number === number)) { showNotification('卡号已存在', 'error'); return; }
    const newAccount = {
        id: Date.now().toString(),
        name, number, balance,
        createdAt: new Date().toISOString()
    };
    bankData.accounts.push(newAccount);
    await saveDataToCloud();
    document.getElementById('accountName').value = '';
    document.getElementById('accountNumber').value = '';
    document.getElementById('initialBalance').value = 1000;
    renderAccounts(); updateStats(); renderAtmAccounts();
    showNotification(`账户 ${name} 创建成功`, 'success');
    logoPreview.classList.add('pulse');
    setTimeout(() => logoPreview.classList.remove('pulse'), 1000);
    addTransaction(newAccount.id, 'income', balance, 'salary', '账户开户存款');
    await saveDataToCloud();
}

function openOperationModal(accountId, type) {
    const account = bankData.accounts.find(acc => acc.id === accountId);
    if (!account) return;
    operationAccountId.value = accountId;
    modalAccountName.textContent = account.name;
    modalAccountNumber.textContent = `卡号: ${account.number}`;
    modalAccountBalance.textContent = `${account.balance.toFixed(2)} 蒜币`;
    currentBalanceDisplay.textContent = account.balance.toFixed(2);
    if (type === 'adjust') {
        setOpType('income');
        document.getElementById('operationType').value = 'adjust';
        modalTitle.innerHTML = '<i class="fas fa-sliders-h"></i> 调整余额';
        categorySelect.innerHTML = '<option value="adjustment" selected>余额调整</option>';
        categorySelect.disabled = true;
        operationAmount.value = account.balance.toFixed(2);
    } else {
        setOpType(type);
        document.getElementById('operationType').value = type;
        categorySelect.disabled = false;
        fillCategorySelect(type);
        operationAmount.value = '';
    }
    operationModal.style.display = 'flex';
}

function setOpType(type) {
    operationType.value = type;
    if (type === 'income') {
        incomeBtn.classList.add('active');
        expenseBtn.classList.remove('active');
        modalTitle.innerHTML = '<i class="fas fa-arrow-down"></i> 收入操作';
    } else {
        incomeBtn.classList.remove('active');
        expenseBtn.classList.add('active');
        modalTitle.innerHTML = '<i class="fas fa-arrow-up"></i> 支出操作';
    }
    fillCategorySelect(type);
}

function fillCategorySelect(type) {
    if (!operationCategories[type]) return;
    categorySelect.innerHTML = '<option value="">请选择类别</option>';
    operationCategories[type].forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat.id;
        opt.textContent = cat.name;
        categorySelect.appendChild(opt);
    });
}

function closeOperationModal() {
    operationModal.style.display = 'none';
    operationForm.reset();
    categorySelect.disabled = false;
}

async function handleOperation(e) {
    e.preventDefault();
    const accountId = operationAccountId.value;
    const type = operationType.value;
    let category = categorySelect.value;
    const amount = parseFloat(operationAmount.value);
    let note = operationNote.value.trim();
    if (type === 'adjust') {
        category = 'adjustment';
        note = note || '余额调整';
    } else if (!category) {
        showNotification('请选择类别', 'error');
        return;
    }
    if (isNaN(amount) || amount <= 0) { showNotification('请输入有效金额', 'error'); return; }
    const account = bankData.accounts.find(acc => acc.id === accountId);
    if (!account) { showNotification('账户不存在', 'error'); return; }
    let newBalance = account.balance;
    let transactionType = type;
    if (type === 'income') {
        newBalance = account.balance + amount;
    } else if (type === 'expense') {
        if (amount > account.balance) { showNotification('余额不足', 'error'); return; }
        newBalance = account.balance - amount;
        transactionType = 'withdrawal';
    } else if (type === 'adjust') {
        newBalance = amount;
        transactionType = 'adjustment';
    }
    const prev = account.balance;
    account.balance = newBalance;
    addTransaction(accountId, transactionType, amount, category, note, prev, newBalance);
    await saveDataToCloud();
    closeOperationModal();
    renderAccounts(); renderTransactions(); updateStats();
    let msg = type === 'income' ? `收入 ${amount.toFixed(2)}` :
              type === 'expense' ? `支出 ${amount.toFixed(2)}` :
              `余额调整为 ${amount.toFixed(2)}`;
    showNotification(`成功：${msg} 蒜币`, 'success');
}

async function handleDeleteAccount() {
    const accountId = operationAccountId.value;
    const account = bankData.accounts.find(acc => acc.id === accountId);
    if (!account) return;
    if (confirm(`确定删除账户 ${account.name} (${account.number}) 吗？`)) {
        bankData.accounts = bankData.accounts.filter(acc => acc.id !== accountId);
        bankData.transactions = bankData.transactions.filter(t => t.accountId !== accountId);
        await saveDataToCloud();
        renderAccounts(); renderTransactions(); updateStats(); renderAtmAccounts();
        closeOperationModal();
        showNotification(`账户 ${account.name} 已删除`, 'success');
    }
}

function showDepositScreen() {
    if (!currentAtmAccount) { showNotification('请选择账户', 'error'); return; }
    document.getElementById('atmMainMenu').style.display = 'none';
    document.getElementById('atmDepositScreen').style.display = 'block';
    atmDepositAmount.value = '500';
}

function showWithdrawScreen() {
    if (!currentAtmAccount) { showNotification('请选择账户', 'error'); return; }
    document.getElementById('atmMainMenu').style.display = 'none';
    document.getElementById('atmWithdrawScreen').style.display = 'block';
    atmWithdrawAmount.value = '200';
}

function showTransferScreen() {
    if (!currentAtmAccount) { showNotification('请选择账户', 'error'); return; }
    document.getElementById('atmMainMenu').style.display = 'none';
    document.getElementById('atmTransferScreen').style.display = 'block';
    atmTransferAmount.value = '300';
}

function showResultScreen(message) {
    document.querySelectorAll('.atm-form').forEach(f => f.style.display = 'none');
    document.getElementById('atmResultScreen').style.display = 'block';
    atmResultMessage.textContent = message;
}

async function handleAtmDeposit() {
    const amount = parseFloat(atmDepositAmount.value);
    if (isNaN(amount) || amount <= 0) { showNotification('请输入有效金额', 'error'); return; }
    currentAtmAccount.balance += amount;
    addTransaction(currentAtmAccount.id, 'income', amount, 'deposit', 'ATM存款');
    await saveDataToCloud();
    updateStats();
    atmAccountBalance.textContent = `${currentAtmAccount.balance.toFixed(2)} 蒜币`;
    showResultScreen(`存款成功！存入 ${amount.toFixed(2)} 蒜币<br>当前余额: ${currentAtmAccount.balance.toFixed(2)} 蒜币`);
    showNotification(`存入 ${amount.toFixed(2)} 蒜币`, 'success');
}

async function handleAtmWithdraw() {
    const amount = parseFloat(atmWithdrawAmount.value);
    if (isNaN(amount) || amount <= 0) { showNotification('请输入有效金额', 'error'); return; }
    if (amount > currentAtmAccount.balance) { showNotification('余额不足', 'error'); return; }
    currentAtmAccount.balance -= amount;
    addTransaction(currentAtmAccount.id, 'withdrawal', amount, 'withdraw', 'ATM取款');
    await saveDataToCloud();
    updateStats();
    atmAccountBalance.textContent = `${currentAtmAccount.balance.toFixed(2)} 蒜币`;
    showResultScreen(`取款成功！取出 ${amount.toFixed(2)} 蒜币<br>当前余额: ${currentAtmAccount.balance.toFixed(2)} 蒜币`);
    showNotification(`取出 ${amount.toFixed(2)} 蒜币`, 'success');
}

async function handleAtmTransfer() {
    const amount = parseFloat(atmTransferAmount.value);
    const toId = atmTransferAccount.value;
    if (isNaN(amount) || amount <= 0) { showNotification('请输入有效金额', 'error'); return; }
    if (!toId) { showNotification('请选择收款账户', 'error'); return; }
    if (amount > currentAtmAccount.balance) { showNotification('余额不足', 'error'); return; }
    const toAccount = bankData.accounts.find(acc => acc.id === toId);
    if (!toAccount) { showNotification('收款账户不存在', 'error'); return; }
    if (toId === currentAtmAccount.id) { showNotification('不能转给自己', 'error'); return; }
    currentAtmAccount.balance -= amount;
    toAccount.balance += amount;
    addTransaction(currentAtmAccount.id, 'withdrawal', amount, 'transfer', `转账给 ${toAccount.name}`);
    addTransaction(toAccount.id, 'income', amount, 'transfer', `来自 ${currentAtmAccount.name}`);
    await saveDataToCloud();
    updateStats();
    atmAccountBalance.textContent = `${currentAtmAccount.balance.toFixed(2)} 蒜币`;
    showResultScreen(`转账成功！转出 ${amount.toFixed(2)} 蒜币 给 ${toAccount.name}<br>当前余额: ${currentAtmAccount.balance.toFixed(2)} 蒜币`);
    showNotification(`转账 ${amount.toFixed(2)} 蒜币 给 ${toAccount.name}`, 'success');
}

function printAtmReceipt() {
    if (!currentAtmAccount) { showNotification('请选择账户', 'error'); return; }
    const content = `
        <div style="font-family:'Exo 2',sans-serif;text-align:center;padding:20px;">
            <h2 style="color:#00c6ff;">大蒜银行</h2>
            <p>-------------------------------</p>
            <h3>账户凭条</h3>
            <p><strong>名称:</strong> ${currentAtmAccount.name}</p>
            <p><strong>卡号:</strong> ${currentAtmAccount.number}</p>
            <p><strong>余额:</strong> ${currentAtmAccount.balance.toFixed(2)} 蒜币</p>
            <p>-------------------------------</p>
            <p>${new Date().toLocaleString()}</p>
            <p style="margin-top:20px;color:#94a3b8;">感谢使用</p>
        </div>
    `;
    const win = window.open('', '_blank');
    win.document.write(`<html><head><title>凭条</title><style>body{font-family:'Exo 2',sans-serif;padding:20px;}</style></head><body>${content}</body></html>`);
    win.document.close();
    setTimeout(() => { win.print(); setTimeout(() => win.close(), 500); }, 500);
}

// ============================================================
// 初始化
// ============================================================
document.addEventListener('DOMContentLoaded', async () => {
    await loadDataFromCloud();
    renderAccounts();
    renderTransactions();
    updateStats();
    renderAtmAccounts();
    if (bankData.logo) {
        logoImage.src = bankData.logo;
        logoImage.style.display = 'block';
        document.querySelector('.logo-preview i').style.display = 'none';
    }

    // 事件绑定
    logoPreview.addEventListener('click', () => logoUpload.click());
    logoUpload.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = async function(ev) {
                logoImage.src = ev.target.result;
                logoImage.style.display = 'block';
                document.querySelector('.logo-preview i').style.display = 'none';
                bankData.logo = ev.target.result;
                await saveDataToCloud();
                showNotification('Logo已更新并同步', 'success');
            };
            reader.readAsDataURL(file);
        }
    });

    addAccountForm.addEventListener('submit', handleAddAccount);
    closeModal.addEventListener('click', closeOperationModal);
    operationForm.addEventListener('submit', handleOperation);
    setBalanceBtn.addEventListener('click', () => setOpType('adjust'));
    deleteAccountBtn.addEventListener('click', handleDeleteAccount);
    incomeBtn.addEventListener('click', () => setOpType('income'));
    expenseBtn.addEventListener('click', () => setOpType('expense'));
    window.addEventListener('click', (e) => { if (e.target === operationModal) closeOperationModal(); });

    atmBtn.addEventListener('click', showAtmInterface);
    backToBankBtn.addEventListener('click', showBankInterface);
    atmAccountSelect.addEventListener('change', handleAtmAccountSelect);
    document.getElementById('atmBalanceBtn').addEventListener('click', showBalanceScreen);
    document.getElementById('atmDepositBtn').addEventListener('click', showDepositScreen);
    document.getElementById('atmWithdrawBtn').addEventListener('click', showWithdrawScreen);
    document.getElementById('atmTransferBtn').addEventListener('click', showTransferScreen);
    document.getElementById('atmConfirmDeposit').addEventListener('click', handleAtmDeposit);
    document.getElementById('atmConfirmWithdraw').addEventListener('click', handleAtmWithdraw);
    document.getElementById('atmConfirmTransfer').addEventListener('click', handleAtmTransfer);
    document.getElementById('atmBackToMenu').addEventListener('click', showAtmMainMenu);
    document.querySelectorAll('.atm-back-btn').forEach(btn => btn.addEventListener('click', showAtmMainMenu));
    document.getElementById('atmPrintReceipt').addEventListener('click', printAtmReceipt);
    document.getElementById('atmAnotherOperation').addEventListener('click', () => {
        showAtmMainMenu();
        document.getElementById('atmAccountSelect').focus();
    });
    document.querySelectorAll('.atm-num-btn').forEach(btn => {
        btn.addEventListener('click', () => { atmWithdrawAmount.value = btn.getAttribute('data-amount'); });
    });

    syncBtn.addEventListener('click', async () => {
        await loadDataFromCloud();
        renderAccounts(); renderTransactions(); updateStats(); renderAtmAccounts();
        if (bankData.logo) {
            logoImage.src = bankData.logo;
            logoImage.style.display = 'block';
            document.querySelector('.logo-preview i').style.display = 'none';
        }
        showNotification('数据已同步', 'success');
    });
});

// 暴露给 onclick
window.openOperationModal = openOperationModal;
</script>
